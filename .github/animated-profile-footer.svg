<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Animated Lakshya Agarwal profile footer">
  <defs>
    <linearGradient id="g-footer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow-footer" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Container -->
  <rect width="1200" height="150" rx="24" fill="#0b0b12"/>

  <!-- Glowing Outer Animated Border -->
  <rect x="8" y="8" width="1184" height="134" rx="20" fill="none" stroke="url(#g-footer)" stroke-width="3" filter="url(#glow-footer)"/>

  <!-- Inner Subtle Accent Border -->
  <rect x="14" y="14" width="1172" height="122" rx="17" fill="none" stroke="url(#g-footer)" stroke-width="1" opacity=".45"/>

  <!-- Main Footer Text (Centered vertically) -->
  <text x="600" y="83" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff">
    Thanks for stopping by! 🚀
  </text>

  <!-- Orbiting Light Dot -->
  <circle cx="1172" cy="122" r="3" fill="#ec4899">
    <animate attributeName="cx" values="1172;28;28;1172;1172" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="122;122;28;28;122" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
